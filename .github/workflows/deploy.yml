name: Deploy Wingrid

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wingrid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore checksum-verified game artwork
        run: npm run assets:ci
      - run: npm run build
      - name: Validate deployment package
        run: npx wrangler deploy --dry-run
      - name: Check deployment credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Apply database migrations
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: df08931372f873bc0c8edb7679dc0cf4
        run: npm run db:migrate:remote
      - name: Deploy production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: df08931372f873bc0c8edb7679dc0cf4
        run: npx wrangler deploy --message "GitHub commit $GITHUB_SHA"
      - name: Check production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curl --fail --silent --show-error --retry 3 https://wingrid.atlesque.dev/ -o /dev/null
          curl --fail --silent --show-error --retry 3 https://wingrid.atlesque.dev/api/config | node --input-type=module -e '
            let body = "";
            for await (const chunk of process.stdin) body += chunk;
            if (JSON.parse(body).gameId !== "wingrid") throw new Error("Unexpected production configuration");
          '
